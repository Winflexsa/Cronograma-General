<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cronograma General · Winflex</title>
<meta name="theme-color" content="#0f8a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-cronograma-192.png">
<link rel="apple-touch-icon" href="icon-cronograma-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6;--surf:#fff;--border:#e5e7eb;--border2:#d1d5db;
  --text:#1f2937;--text2:#6b7280;--text3:#9ca3af;
  --g:#16a34a;--gd:#0f8a5f;--gdd:#0a5e38;--gl:#e8f7ef;--gl2:#ccebd9;
  --ok:#0e7a49;--okl:#e4f6ec;--mid:#a16207;--midl:#fdf3dc;--bad:#b42318;--badl:#fdecea;
  --via:#6d4fc2;--via-l:#f3effc;--via-b:#dcd2f5;
  --ent:#3f8a1f;--ent-l:#f1f8ea;--ent-b:#d2e8c1;
  --pet:#2563eb;--pet-l:#eef4ff;--pet-b:#cfe0fb;
  --ter:#0f8a5f;--ter-l:#ebf8f1;--ter-b:#c8eadb;
  --lam:#c2650f;--lam-l:#fdf3e7;--lam-b:#f3dbbd;
  --ref:#0e8a8a;--ref-l:#e8f6f6;--ref-b:#c3e5e4;
  --sh:0 1px 2px rgba(15,23,42,.04),0 3px 12px rgba(15,23,42,.06);
  --sh2:0 6px 20px rgba(15,23,42,.10);
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;margin:0}
button,input,select,textarea{font-family:inherit;font-size:14px}
.mono{font-family:var(--mono)}
.hidden{display:none!important}

/* ── encabezado y pestañas (como PET Chivilcoy) ── */
header{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(0,0,0,.05)}
header img{height:34px}
header h1{font-size:18px;margin:0;font-weight:700}
header .sub{font-size:12px;color:var(--text3)}
header .sp{flex:1}
.sync{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sb{font-size:11px;padding:4px 10px;border-radius:999px;background:#f3f4f6;color:var(--text2);font-weight:600;white-space:nowrap}
.sb::before{content:'●';margin-right:5px;color:var(--g)}
.sb.err{background:var(--badl);color:var(--bad)}.sb.err::before{color:var(--bad)}
.sb.load::before{content:'◌';color:var(--text3)}
nav.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:20}
.tab{padding:13px 18px;cursor:pointer;border:none;background:none;font-size:14px;color:var(--text2);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--g);border-bottom-color:var(--g)}
main{padding:18px 24px 40px;max-width:1800px;margin:0 auto}

/* ── botones ── */
.btn{background:#fff;border:1px solid var(--border2);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--text);font-weight:600;white-space:nowrap;font-size:13px}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}.btn.pri:hover{background:var(--gd)}
.btn.via{background:var(--via);border-color:var(--via);color:#fff}.btn.via:hover{filter:brightness(.95)}
.btn.bad{color:var(--bad);border-color:#f1c5c0}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ic{padding:6px 10px}
.seg{display:inline-flex;background:#eef0f2;border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer}
.seg button.on{background:#fff;color:var(--gd);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ── banner ── */
.hero{background:linear-gradient(120deg,#0f8a5f 0%,#16a34a 60%,#22b35e 100%);color:#fff;border-radius:16px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(15,138,95,.25)}
.hero .s{font-size:13px;opacity:.9}
.hero .t{font-size:21px;font-weight:700;margin-top:2px}
.hero .r{display:flex;gap:22px;flex-wrap:wrap}
.hero .r div{text-align:right}
.hero .r small{display:block;font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.hero .r b{font-family:var(--mono);font-size:24px;font-weight:500}
.hero.via{background:linear-gradient(120deg,#5b3fb0 0%,#6d4fc2 60%,#8466d6 100%);box-shadow:0 6px 18px rgba(109,79,194,.25)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.wk{font-weight:700;font-size:15px;margin:0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--border2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:6px}
.fchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fchip.off{opacity:.4}

/* ── semana en tarjetas por día ── */
.week{display:grid;grid-template-columns:repeat(7,minmax(178px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.day{scroll-margin-top:58px;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0}
.day.hoy{border:2px solid var(--g);box-shadow:0 0 0 4px var(--gl),var(--sh)}
.day.dom .dh{background:#fafafa}
.dh{display:flex;justify-content:space-between;align-items:center;padding:11px 12px 10px;border-bottom:1px solid #f0f1f3;border-radius:16px 16px 0 0}
.dh b{font-size:14px}
.dh .hb{background:var(--g);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.dh .add{white-space:nowrap;background:var(--g);color:#fff;border:0;border-radius:8px;padding:4px 10px;font-weight:700;font-size:12px;cursor:pointer}
.dh .add:hover{background:var(--gd)}
.db{padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.ar{display:flex;flex-direction:column;gap:6px}
.al{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.al span.p{cursor:pointer;opacity:.0;font-size:14px;line-height:1;padding:0 4px}
.day:hover .al span.p{opacity:.7}
.empty{color:var(--text3);font-size:12px;font-style:italic;text-align:center;padding:18px 0}
.df{border-top:1px solid #f0f1f3;padding:7px 12px;font-size:11px;color:var(--text3);display:flex;justify-content:space-between}

/* ── tarjetas de cada cosa ── */
.it{border-radius:11px;padding:8px 10px;font-size:12px;line-height:1.35;cursor:pointer;border:1px solid var(--border);background:#fff;transition:box-shadow .15s,transform .15s}
.it:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.it .h{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.it b{font-weight:700;font-size:12.5px;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis}
.it .m{color:var(--text2);font-size:11px;margin-top:1px}
.it .k{font-family:var(--mono);font-size:11.5px;font-weight:500;margin-top:3px}
.it .n{color:var(--text2);font-size:11px;font-style:italic;margin-top:2px}
.it.pet{background:var(--pet-l);border-color:var(--pet-b)}.it.pet .k{color:var(--pet)}
.it.ter{background:var(--ter-l);border-color:var(--ter-b)}.it.ter .k{color:var(--ter)}
.it.lam{background:var(--lam-l);border-color:var(--lam-b)}.it.lam .k{color:var(--lam)}
.it.ref{background:var(--ref-l);border-color:var(--ref-b)}.it.ref .k{color:var(--ref)}
.it.via{background:var(--via-l);border-color:var(--via-b)}.it.via .k{color:var(--via)}
.it.ent{background:var(--ent-l);border-color:var(--ent-b)}.it.ent .k{color:var(--ent)}
.it .cl{font-size:11px;color:var(--text);margin-top:2px;display:flex;justify-content:space-between;gap:6px}.it .cl span:last-child{color:var(--text2);font-family:var(--mono);white-space:nowrap}
.hero.ent{background:linear-gradient(120deg,#0f8a5f 0%,#2f9a3a 60%,#4caf3c 100%);box-shadow:0 6px 18px rgba(47,154,58,.25)}
.btn.ent{background:var(--ent);border-color:var(--ent);color:#fff}.btn.ent:hover{filter:brightness(.95)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.ed{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);overflow:hidden;scroll-margin-top:58px}
.ed.hoy{border:2px solid var(--ent);box-shadow:0 0 0 4px var(--ent-l),var(--sh)}
.ed .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #f0f1f3;flex-wrap:wrap}
.ed .eh b{font-size:15px}
.ev{padding:10px 14px;border-top:1px solid #f3f4f6}
.ev:first-of-type{border-top:none}
.evh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ent)}
.evh .mono{text-transform:none;letter-spacing:0;font-weight:600;color:var(--text)}
.er{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;margin-top:7px;border:1px solid var(--ent-b);background:var(--ent-l);border-radius:11px;cursor:pointer}
.er:hover{box-shadow:var(--sh2)}
.er b{font-size:13px}.er .q{font-family:var(--mono);font-size:12px;text-align:right;white-space:nowrap}
.er .d{grid-column:1 / -1;font-size:11.5px;color:var(--text2)}
.er.ok{background:#f3faf6;border-color:#cdebd9}.er.canc{opacity:.45;text-decoration:line-through}
.ordn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--ent);color:#fff;font-size:11px;font-weight:800;margin-right:2px;vertical-align:1px}
.mv{display:inline-flex;gap:2px;margin-left:8px;vertical-align:1px}.mv button{border:1px solid var(--border2);background:#fff;border-radius:6px;font-size:9px;line-height:1;padding:3px 5px;cursor:pointer;color:var(--text2)}.mv button:disabled{opacity:.3;cursor:default}
.ee{padding:14px;color:var(--text3);font-size:12.5px;font-style:italic;display:flex;justify-content:space-between;align-items:center}
.it.proy{background:#fff;border:1.5px dashed currentColor}
.it.pet.proy{color:var(--pet)}.it.lam.proy{color:var(--lam)}.it.ref.proy{color:var(--ref)}
.it.evt{background:#f5f5f4;border-color:#e7e5e4}
.it.canc{opacity:.45;text-decoration:line-through}
.tg{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap;letter-spacing:.02em}
.tg.p{background:currentColor}.tg.p span{color:#fff}
.tg.ida{background:#ede7fb;color:var(--via)}.tg.vue{background:#e6f0ff;color:#2f5fc4}
.tg.ok{background:var(--okl);color:var(--ok)}.tg.mid{background:var(--midl);color:var(--mid)}.tg.bad{background:var(--badl);color:var(--bad)}.tg.gr{background:#eef0f2;color:var(--text2)}
.occ{height:6px;border-radius:999px;background:rgba(0,0,0,.07);margin-top:5px;overflow:hidden}
.occ i{display:block;height:100%;border-radius:999px}

/* ── viajes (lista) ── */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.vc{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);overflow:hidden;cursor:pointer}
.vc:hover{box-shadow:var(--sh2)}
.vc .vh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #f0f1f3;gap:8px}
.vc .vh b{font-size:15px}
.vc .vh small{color:var(--text3);font-size:12px;display:block}
.legs{display:grid;grid-template-columns:1fr 1fr}
.leg{padding:11px 14px;min-width:0}
.leg+.leg{border-left:1px solid #f0f1f3}
.leg .lt{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;justify-content:space-between}
.leg .lf{font-size:12px;color:var(--text2);margin-top:2px}
.leg .lc{font-size:12.5px;margin-top:6px;min-height:18px}
.leg .lv{font-family:var(--mono);font-size:12px;margin-top:4px;display:flex;justify-content:space-between}
.vc .vf{padding:9px 14px;border-top:1px solid #f0f1f3;background:#fafafa;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:22px 0 10px}
.sec h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gd)}


/* ── Entregas v2.6: barra de días + ruta del día ── */
.edays{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:8px;overflow-x:auto;padding:2px 2px 8px}
.eday{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:box-shadow .15s,border-color .15s;min-width:0;font:inherit;color:inherit}
.eday:hover{box-shadow:var(--sh2)}
.eday .dn{font-size:12px;font-weight:700;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
.eday .dd{font-size:19px;font-weight:700;margin-top:1px}
.eday .ds{font-size:11.5px;color:var(--text3);margin-top:3px;min-height:15px}
.eday .ds b{color:var(--text);font-weight:600}
.eday.on{border:2px solid var(--ent);box-shadow:0 0 0 4px var(--ent-l),var(--sh);padding:9px 11px}
.eday.vac .dd,.eday.vac .dn{color:var(--text3)}
.eday .hoyb{background:var(--ent);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:5px}
.eday .cobd{font-size:11px}
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.rhead h2{margin:0;font-size:20px}
.rhead .sp{flex:1}
.rhead .sum{font-size:13px;color:var(--text2)}
.vbox{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.vbh{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fafbfa;border-bottom:1px solid var(--border);flex-wrap:wrap}
.vbh .vt{font-size:15px;font-weight:800;color:var(--ent)}
.vbh .vm{font-size:12.5px;color:var(--text2)}
.vbh .cap{flex:1;min-width:180px;display:flex;align-items:center;gap:8px}
.vbh .cap .occ{flex:1;height:9px;margin:0}
.vbh .cap b{font-family:var(--mono);font-size:13px;min-width:42px;text-align:right}
.stop{display:grid;grid-template-columns:44px 1fr auto;gap:12px;padding:12px 16px;border-top:1px solid #f1f2f4;align-items:start;cursor:pointer}
.stop:first-of-type{border-top:none}
.stop:hover{background:#fbfcfb}
.stop .num{width:32px;height:32px;border-radius:50%;background:var(--ent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:1px}
.stop.done .num{background:#9ca3af}
.stop.done .sc b{text-decoration:line-through;color:var(--text2)}
.stop.canc{opacity:.45}
.stop .sc b{font-size:15px}
.stop .sl{font-size:12.5px;color:var(--text2);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.stop .cob{margin-top:6px;display:inline-block;background:var(--midl);color:#7a4a05;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:8px}
.stop .ob{font-size:12px;color:var(--text2);font-style:italic;margin-top:4px}
.stop .sr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.stop .kg{font-family:var(--mono);font-size:15px;font-weight:500;white-space:nowrap}
.stop .kg small{display:block;font-size:11.5px;color:var(--text3)}
.stop .acts{display:flex;gap:4px}
.stop .acts button{border:1px solid var(--border2);background:#fff;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--text2)}
.stop .acts button:hover{background:#f3f4f6}
.stop .acts button:disabled{opacity:.3;cursor:default}
.stop .acts button.ok{border-color:#cdebd9;color:var(--ok)}
.tipo{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.tipo.entregar{background:#eef0f2;color:var(--text2)}
.tipo.entcob,.tipo.cobrar{background:var(--midl);color:#8a5a06}
.addrow{display:flex;gap:8px;padding:10px 16px;border-top:1px dashed var(--border2);background:#fcfdfc;flex-wrap:wrap}
.addrow button{border:1px dashed var(--border2);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:12.5px;color:var(--ent);cursor:pointer}
.addrow button:hover{background:var(--ent-l)}
.vacio{background:#fff;border:1px dashed var(--border2);border-radius:16px;padding:34px 20px;text-align:center;color:var(--text2)}
.vacio b{display:block;font-size:16px;color:var(--text);margin-bottom:4px}
.entw{max-width:1240px;margin:0 auto}
.ecols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.emain{min-width:0}
.eside{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);overflow:hidden;position:sticky;top:12px}
.eside .esh{padding:11px 14px;border-bottom:1px solid var(--border);background:#fafbfa;font-weight:800;font-size:13px;color:var(--ent);display:flex;justify-content:space-between;align-items:center}
.eside .esh span{font-weight:600;color:var(--text2);font-size:12px}
.esd{border-top:1px solid #f1f2f4;padding:8px 14px;cursor:pointer}
.esd:first-of-type{border-top:none}
.esd:hover{background:#fbfcfb}
.esd.on{background:var(--ent-l)}
.esd .esdh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
.esd .esdh b{font-size:13px}
.esd .esdh span{color:var(--text2);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.esd ol{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.esd li{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--text)}
.esd li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esd li span:last-child{color:var(--text3);font-family:var(--mono);font-size:11px;white-space:nowrap}
.esd li.done span:first-child{text-decoration:line-through;color:var(--text3)}
.esd .esv{font-size:11.5px;color:var(--text3)}
.stop{grid-template-columns:36px minmax(0,1fr) auto;gap:12px;padding:11px 14px}
.stop .num{width:28px;height:28px;font-size:13px}
.stop .sc b{font-size:14.5px}
.stop .carga{display:inline-flex;gap:6px;align-items:baseline;margin-left:8px;font-family:var(--mono);font-size:12.5px;color:var(--text);background:#f3f6f3;border-radius:7px;padding:1px 7px;vertical-align:1px}
.stop .carga small{color:var(--text2);font-size:11.5px}
.stop .sr{flex-direction:row;align-items:center}
.conex{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh);padding:22px;max-width:620px;margin:10px auto}
.conex h3{margin:0 0 6px;font-size:18px}
.conex p{margin:0 0 12px;color:var(--text2);font-size:13.5px;line-height:1.45}
.conex .row{display:flex;gap:8px;flex-wrap:wrap}
.conex .row input{flex:1;min-width:200px;font-family:var(--mono);font-size:12.5px;padding:9px 10px;border:1px solid var(--border2);border-radius:10px}
@media (max-width:1100px){.ecols{grid-template-columns:1fr}.eside{position:static}}
@media (max-width:760px){
  .edays{grid-template-columns:repeat(7,104px)}
  .stop{grid-template-columns:36px 1fr;gap:10px}
  .stop .num{width:28px;height:28px;font-size:13px}

<script>
'use strict';
const VERSION = 'v2.7';
document.getElementById('ver').textContent = '· ' + VERSION;

/* ═════════ CONEXIONES (las mismas que usan las apps) ═════════ */
const JB_KEY_DEF = '$2a$10$8p4t41BnTv.9Ls.4kFLhouDMqJGQEd5LQlBYEz8n1y6nH/3dFq27G';
function lsGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
function termoCfg() { return { bin: lsGet('wf_termo_binid') || '6a243e42da38895dfe915231', key: lsGet('wf_termo_apikey') || JB_KEY_DEF, type: 'master' }; }
function lamCfg() {
  let c = { bin: '6aa94df9ffd5d160530a1a0b', key: JB_KEY_DEF, keyType: 'master' };
  try { const x = JSON.parse(lsGet('wr_cfg') || 'null'); if (x && x.bin && x.key) c = Object.assign(c, x); } catch (_) {}
  return { bin: c.bin, key: c.key, type: c.keyType || 'master' };
}
function jbHeaders(c, extra) { return Object.assign({ [c.type === 'access' ? 'X-Access-Key' : 'X-Master-Key']: c.key }, extra || {}); }
function gistCreds() { try { return JSON.parse(lsGet('winflex_gist_credentials') || 'null'); } catch (_) { return null; } }
(function importarCredsDesdeLink() { // mismo link de conexión que genera PET Chivilcoy (#wfc=...)
  try {
    const m = (location.hash || '').match(/[#&]wfc=([^&]+)/); if (!m) return;
    const j = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/')))));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (_) { location.hash = ''; }
    if (j && j.g && j.t) lsSet('winflex_gist_credentials', JSON.stringify({ gistId: j.g, token: j.t }));
  } catch (e) { console.warn('link de conexión inválido', e); }
})();

/* ═════════ UTILIDADES ═════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowISO = () => new Date().toISOString();
const fmt = n => (Math.round(+n || 0)).toLocaleString('es-AR');
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const hoyISO = () => ymd(new Date());
function addD(s, n) { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return ymd(d); }
function lunesDe(s) { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); }
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DIASL = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const dow = s => new Date(s + 'T12:00').getDay();
const dm = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const dLargo = s => `${DIAS[dow(s)]} ${+s.slice(8, 10)} ${MESES[+s.slice(5, 7) - 1]}`;
const uid = p => p + '-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
let toastT;
function toast(msg, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.querySelectorAll('.toast').forEach(x => x.remove()); document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 6000 : 3000); }
function busy(on, txt) { let b = document.querySelector('.busy'); if (on) { if (!b) { b = document.createElement('div'); b.className = 'busy'; document.body.appendChild(b); } b.textContent = txt || 'Guardando…'; } else if (b) b.remove(); }
function confirmar(msg, ok) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'mbg'; d.style.zIndex = 160;
    d.innerHTML = `<div class="modal" style="max-width:400px;margin-top:80px"><div class="mb" style="font-size:14px;white-space:pre-line">${msg}</div><div class="mf"><button class="btn" data-v="0">Cancelar</button><button class="btn pri" data-v="1">${ok || 'Aceptar'}</button></div></div>`;
    d.onclick = e => { const v = e.target.getAttribute('data-v'); if (v != null || e.target === d) { d.remove(); res(v === '1'); } };
    document.body.appendChild(d);
  });
}

/* ═════════ ÁREAS ═════════ */
const AREAS = [
  { id: 'via', nom: 'Viajes', sub: 'Chivilcoy ↔ Lanús', cls: 'via', col: 'var(--via)' },
  { id: 'ent', nom: 'Entregas clientes', sub: 'Eugenio', cls: 'ent', col: 'var(--ent)' },
  { id: 'pet', nom: 'Extrusión PET', sub: 'Chivilcoy', cls: 'pet', col: 'var(--pet)' },
  { id: 'ter', nom: 'Termoformado', sub: 'Lanús', cls: 'ter', col: 'var(--ter)' },
  { id: 'lam', nom: 'Laminadora', sub: 'Lanús', cls: 'lam', col: 'var(--lam)', maq: 'Laminadora' },
  { id: 'rv', nom: 'Refiladora Verde', sub: 'Lanús', cls: 'ref', col: 'var(--ref)', maq: 'Refiladora Verde' },
  { id: 'rg', nom: 'Refiladora Gris', sub: 'Lanús', cls: 'ref', col: 'var(--ref)', maq: 'Refiladora Gris' },
];
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));

/* ═════════ TRANSPORTES Y CAPACIDADES ═════════ */
const CAP_DEF = {
  Aguirre: { u: 'pos', cap: 14 },
  Monti: { u: 'pos', cap: 11 },
  Eugenio: { u: 'kg', cap: 2000 },
};
function caps() { return (S.via && S.via.capacidades) || CAP_DEF; }
function capTxt(t) { const c = caps()[t]; if (!c) return ''; return c.u === 'kg' ? (c.cap >= 1000 ? fmt(c.cap / 1000) + ' t' : fmt(c.cap) + ' kg') : c.cap + ' posiciones'; }
function uTxt(t, n) { const c = caps()[t]; if (!c) return fmt(n); return c.u === 'kg' ? fmt(n) + ' kg' : fmt(n) + ' pos.'; }
function legUso(v, l) { const c = caps()[v.transporte], x = v[l]; if (!c || !x) return 0; return +(c.u === 'kg' ? x.kg : x.pos) || 0; }
function legOcc(v, l) { const c = caps()[v.transporte]; if (!c || !c.cap) return null; return legUso(v, l) / c.cap; }
function occCol(p) { return p == null ? '#cbd5e1' : p >= .85 ? 'var(--ok)' : p >= .6 ? '#d39a14' : 'var(--bad)'; }
function occCls(p) { return p == null ? 'gr' : p >= .85 ? 'ok' : p >= .6 ? 'mid' : 'bad'; }
const pct = p => p == null ? '—' : Math.round(p * 100) + '%';
function barra(p) { return `<div class="occ"><i style="width:${Math.min(100, Math.round((p || 0) * 100))}%;background:${occCol(p)}"></i></div>`; }

/* ═════════ ESTADO ═════════ */
const S = {
  ter: null, lam: null, pet: null, via: null,
  petPedidos: [], petProd: {},
  err: { ter: '', lam: '', pet: '', via: '', cob: '', ep: '' },
  cob: [], ep: null,
  ini: lunesDe(hoyISO()),
  tab: lsGet('cg_tab') || 'crono',
  ocultas: (() => { try { return JSON.parse(lsGet('cg_ocultas') || '[]'); } catch (_) { return []; } })(),
  per: lsGet('cg_per') || 'mes',
};

/* ═════════ LECTURA / ESCRITURA ═════════ */
async function jbGet(c) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${c.bin}/latest`, { headers: jbHeaders(c, { 'X-Bin-Meta': 'false' }), cache: 'no-store' });
  if (!r.ok) throw new Error('JSONBin HTTP ' + r.status);
  const j = await r.json();
  return (j && j.record && !j.cronograma && !j.ocs) ? j.record : j;
}
async function jbPut(c, data) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${c.bin}`, { method: 'PUT', headers: jbHeaders(c, { 'Content-Type': 'application/json', 'X-Bin-Versioning': 'false' }), body: JSON.stringify(data) });
  if (!r.ok) throw new Error('No se pudo guardar (HTTP ' + r.status + ')');
}
async function gistGet() {
  const c = gistCreds(); if (!c || !c.gistId || !c.token) throw new Error('SIN_GIST');
  const r = await fetch('https://api.github.com/gists/' + c.gistId, { headers: { Authorization: 'token ' + c.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (!r.ok) throw new Error('Gist HTTP ' + r.status);

}
async function gistFile(gj, name) {
  const f = gj && gj.files && gj.files[name]; if (!f) return null;
  if (!f.truncated) return f.content;
  const r = await fetch(f.raw_url, { cache: 'no-store' }); if (!r.ok) throw new Error('raw HTTP ' + r.status);

}

  const c = gistCreds(); if (!c) throw new Error('SIN_GIST');
  const r = await fetch('https://api.github.com/gists/' + c.gistId, { method: 'PATCH', headers: { Authorization: 'token ' + c.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ files }) });
  if (!r.ok) throw new Error('No se pudo guardar en el Gist (HTTP ' + r.status + ')');

// los pedidos del Gist de PET vienen con nombres cortos
const PED_REV = { fi: 'fechaIngreso', fe: 'fechaEntrega', cl: 'cliente', med: 'medida', col: 'color', kp: 'kgPedidos', kr: 'kgReales', a: 'ancho', e: 'espesor', ew: 'estadoWorkflow', prd: 'producto', no: 'nroOP', pdt: 'productoTipo', dc: 'destinoCodigo', ns: 'nroSolicitud' };
function pedLargo(p) { if (!p || 'cliente' in p) return p; const o = {}; for (const k in p) o[PED_REV[k] || k] = p[k]; return o; }
function parseCrono(txt) { try { const o = JSON.parse(txt || '{}'); return { planificacion: o.planificacion || {}, planificacionEliminados: o.planificacionEliminados || {} }; } catch (_) { return { planificacion: {}, planificacionEliminados: {} }; } }

// viajes.json (en el Gist de PET). v2: cada viaje tiene ida (Chivilcoy→Lanús) y vuelta (Lanús→Chivilcoy)
const TR_ALIAS = { 'camión de monti': 'Monti', 'camion de monti': 'Monti', 'monti': 'Monti', 'aguirre': 'Aguirre', 'eugenio': 'Eugenio' };
function normTr(t) { return TR_ALIAS[String(t || '').trim().toLowerCase()] || String(t || '').trim(); }
function migrarViaje(v) {
  if (v.fmt === 3) return v;
  if (v.ida || v.vuelta) { // formato 2 (ida = Chivilcoy→Lanús, con fecha por tramo) → se invierte
    const a = v.ida || {}, b = v.vuelta || {};
    return { id: v.id, fmt: 3, transporte: normTr(v.transporte), estado: v.estado || 'programado', nota: v.nota || '', creado: v.creado, mod: v.mod,
      fecha: a.fecha || b.fecha || '', hora: a.hora || b.hora || '',
      ida: { carga: b.carga || '', pos: b.pos || '', kg: b.kg || '', items: b.items || [], remito: b.remito || null },
      vuelta: { carga: a.carga || '', pos: a.pos || '', kg: a.kg || '' } };
  }
  // formato v1: fecha / hora / lleva / trae / pallets
  const o = { id: v.id, fmt: 3, transporte: normTr(v.transporte), estado: v.estado === 'confirmado' ? 'programado' : (v.estado || 'programado'), nota: v.nota || '', creado: v.creado, mod: v.mod,
    fecha: v.fecha || '', hora: v.hora || '',
    ida: { carga: v.trae || '', pos: '', kg: '', items: [] },

  return o;
}
function parseViajes(txt) {
  let o = {}; try { o = JSON.parse(txt || '{}'); } catch (_) {}
  const capacidades = Object.assign({}, CAP_DEF, o.capacidades || {});
  return { viajes: (o.viajes || []).map(migrarViaje), viajesEliminados: o.viajesEliminados || {}, capacidades, remProx: +o.remProx || 1, remPV: o.remPV || '0002' };
}

const COB_BIN = '6a0b2b196877513b27912597', EP_BIN = '6a7a079bda38895dfed1e0ed';
let ultExtras = 0;
async function cargarExtras(forzar) { // Seguimiento Cobranzas (clientes) y Estadopedidos (OC) · solo lectura
  if (!forzar && Date.now() - ultExtras < 10 * 60000) return; ultExtras = Date.now();
  const c = { key: JB_KEY_DEF, type: 'master' };
  const [cob, ep] = await Promise.allSettled([jbGet(Object.assign({ bin: COB_BIN }, c)), jbGet(Object.assign({ bin: EP_BIN }, c))]);
  if (cob.status === 'fulfilled') { S.cob = ((cob.value && cob.value.clientes) || []).map(x => ({ nombre: String(x.razonSocial || '').trim(), cuit: x.cuit || '', tel: ((x.contactos || [])[0] || {}).telefono || x.contactoTelefono || '', contacto: ((x.contactos || [])[0] || {}).nombre || x.contactoNombre || '' })).filter(x => x.nombre); S.err.cob = ''; }
  else S.err.cob = cob.reason && cob.reason.message || 'error';
  if (ep.status === 'fulfilled') { const r = ep.value || {}; S.ep = { ocs: r.ocs || [], entregas: r.entregas || [], borrados: r.borrados || {}, clientes: r.clientes || [] }; S.err.ep = ''; }
  else S.err.ep = ep.reason && ep.reason.message || 'error';
}
function epPendientes() { // OC abiertas de Estadopedidos con su saldo (kg pedidos − entregados)
  if (!S.ep) return [];
  const b = S.ep.borrados || {}, ent = {};
  S.ep.entregas.forEach(e => { if (!b[e.id]) ent[e.oc] = (ent[e.oc] || 0) + (+e.kg || 0); });
  return S.ep.ocs.filter(o => !b[o.id]).map(o => ({ id: o.id, cli: o.cli, num: o.num, art: o.art || '', fe: o.fe || '', kg: +o.kg || 0, saldo: +((+o.kg || 0) - (ent[o.id] || 0)).toFixed(1), cerrada: !!o.cerradaManual }))
    .filter(o => o.saldo > 0.05 && !o.cerrada).sort((a, b) => (a.fe || '9').localeCompare(b.fe || '9'));
}
async function cargarTermo() { try { S.ter = await jbGet(termoCfg()); S.err.ter = ''; } catch (e) { S.err.ter = e.message; } }
async function cargarLam() { try { S.lam = await jbGet(lamCfg()); S.err.lam = ''; } catch (e) { S.err.lam = e.message; } }
async function cargarGist(conPedidos) {
  try {
    const gj = await gistGet();

function viajesVivos() { return S.via ? S.via.viajes.filter(v => !S.via.viajesEliminados[v.id]) : []; }
function items(fecha, area) {
  const out = [];
  if (area === 'via') {
    viajesVivos().filter(v => v.fecha === fecha).sort((a, b) => (a.hora || '').localeCompare(b.hora || '')).forEach(v => out.push({ src: 'via', o: v }));
  }
  if (area === 'ent') entViajesDia(fecha).forEach(g => out.push({ src: 'ent', o: { id: fecha + '|' + g.n }, fecha, g }));
  if (area === 'pet' && S.pet) {
    const d = S.pet.planificacion[fecha]; const tomb = S.pet.planificacionEliminados || {};
    ((d && d.ops) || []).filter(op => !tomb[op.id]).sort((a, b) => (a.prioridad || 0) - (b.prioridad || 0)).forEach(op => out.push({ src: 'pet', o: op, fecha }));
  }
  if (area === 'ter' && S.ter) {
    const tomb = new Set((S.ter.cronogramaBorrados || []).map(t => t.id)); const ord = { M1: 1, M2: 1, N: 2 };
    (S.ter.cronograma || []).filter(c => c.fecha === fecha && !tomb.has(c.id)).sort((a, b) => (ord[a.turno] || 0) - (ord[b.turno] || 0)).forEach(c => out.push({ src: 'ter', o: c }));
  }
  if (AREA[area] && AREA[area].maq && S.lam) {
    const tomb = S.lam.tomb || {}; const ord = { 'Mañana': 1, 'Todo el día': 2, 'Tarde': 3, 'Noche': 4 };
    (S.lam.cronograma || []).filter(c => !c.del && !tomb['cronograma:' + c.id] && c.fecha === fecha && c.maq === AREA[area].maq).sort((a, b) => (ord[a.turno] || 9) - (ord[b.turno] || 9)).forEach(c => out.push({ src: 'lam', o: c, area }));

}

  if (per === 'mes') return [hoy.slice(0, 8) + '01', hoy];

  if (per === 'd30') return [addD(hoy, -29), hoy];

    r.cronograma = r.cronograma || [];
    const i = r.cronograma.findIndex(x => x.id === o.id); if (i >= 0) r.cronograma[i] = o; else r.cronograma.push(o);
    if (o.turno === 'M1' || o.turno === 'M2') r.cronograma.forEach(x => { if (x.fecha === o.fecha && (x.turno === 'M1' || x.turno === 'M2') && x.turno !== o.turno) { x.turno = o.turno; x.mod = o.mod; } });
  }, r => (r.cronograma || []).some(x => x.id === o.id && (x.mod || '') >= o.mod)));
}
async function borrarTer() {
  if (!await confirmar('¿Borrar esta asignación de Termoformado?', 'Borrar')) return;
  const id = ED.id;
  await escribir('Termoformado', () => terWrite(r => { r.cronograma = (r.cronograma || []).filter(x => x.id !== id); r.cronogramaBorrados = r.cronogramaBorrados || []; if (!r.cronogramaBorrados.some(t => t.id === id)) r.cronogramaBorrados.push({ id, ts: nowISO() }); },
    r => !(r.cronograma || []).some(x => x.id === id)));
}
async function terWrite(mut, ok) {
  const c = termoCfg();
  for (let i = 0; i < 2; i++) {
    const r = await jbGet(c); // siempre sobre lo último de la nube: se conserva todo lo demás del bin
    mut(r); r._w = { app: 'cronograma-general ' + VERSION, ts: nowISO() };
    await jbPut(c, r);
    const chk = await jbGet(c); // verificación: si la tablet pisó justo en el medio, se reintenta
    if (ok(chk)) { S.ter = chk; return; }
  }
  throw new Error('Termoformado no confirmó el cambio, probá de nuevo');
}

/* ── LAMINADO Y REFILADO (bin JSONBin winflex-refilado) ── */
function formLam(o) {
  ED = o; const L = S.lam || {};
  const ocs = (L.ocs || []).filter(x => x.estado === 'abierta').sort((a, b) => String(a.cliente || '').localeCompare(String(b.cliente || '')));
  if (o.ocId && !ocs.some(x => x.id === o.ocId)) { const x = lamOc(o.ocId); if (x) ocs.unshift(x); }
  const tipo = o.ocId ? 'oc' : o.proy ? 'proy' : (o.id ? 'otro' : (ocs.length ? 'oc' : 'proy'));
  const clis = [...new Set([...(L.catalogo || []).map(p => p.cliente), ...(L.ocs || []).map(x => x.cliente)].filter(Boolean).map(x => String(x).trim()))].sort();
  const prods = [...new Set((L.catalogo || []).map(p => `${p.cliente} ${p.medida || ''}`.trim()))].sort();
  modal(o.id ? '🎞 Laminado y Refilado · editar' : '🎞 Laminado y Refilado · agregar', `
    <div class="f"><label>Fecha</label><input type="date" id="l_fecha" value="${esc(o.fecha)}"></div>
    <div class="f"><label>Máquina</label><select id="l_maq">${['Laminadora', 'Refiladora Verde', 'Refiladora Gris'].map(m => `<option ${m === o.maq ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    <div class="f"><label>Turno</label><select id="l_turno">${['Mañana', 'Tarde', 'Noche', 'Todo el día'].map(t => `<option ${t === o.turno ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <div class="f"><label>Tipo</label><select id="l_tipo" onchange="lamTipo()"><option value="oc" ${tipo === 'oc' ? 'selected' : ''}>Con OC</option><option value="proy" ${tipo === 'proy' ? 'selected' : ''}>Proyectada (sin OC)</option><option value="otro" ${tipo === 'otro' ? 'selected' : ''}>Otra tarea</option></select></div>
    <div class="f w l-oc"><label>OC</label><select id="l_oc"><option value="">— elegir OC —</option>${ocs.map(x => `<option value="${esc(x.id)}" ${x.id === o.ocId ? 'selected' : ''}>${esc(x.cliente)} · OC ${esc(x.nro)} · ${esc(x.desc || '')} · ${fmt(x.kg)} kg</option>`).join('')}</select></div>
    <div class="f l-pr"><label>Cliente</label><input id="l_cli" list="l_clis" value="${esc(o.pCli || '')}"><datalist id="l_clis">${clis.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="f l-pr"><label>Producto / medida</label><input id="l_desc" list="l_prods" value="${esc(o.pDesc || '')}"><datalist id="l_prods">${prods.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="f"><label>Operario</label><select id="l_op"><option value="">—</option>${(L.operarios || []).map(x => `<option ${x.n === o.operario ? 'selected' : ''}>${esc(x.n)}</option>`).join('')}</select></div>
    <div class="f"><label>Kg objetivo</label><input type="number" id="l_kg" step="any" value="${esc(o.kgObj ?? '')}"></div>
    <div class="f w"><label>Nota <span class="h" id="l_nh"></span></label><input id="l_nota" value="${esc(o.nota || '')}"></div>`,
    pieForm('guardarLam()', o.id ? 'borrarLam()' : ''));
  lamTipo();
}
function lamTipo() { const t = v('l_tipo'); document.querySelectorAll('.l-oc').forEach(e => e.style.display = t === 'oc' ? '' : 'none'); document.querySelectorAll('.l-pr').forEach(e => e.style.display = t === 'proy' ? '' : 'none'); $('l_nh').textContent = t === 'otro' ? '(qué tarea es)' : ''; }
async function guardarLam() {
  const tp = v('l_tipo'), t = nowISO();
  const o = Object.assign({}, ED, { fecha: v('l_fecha'), maq: v('l_maq'), turno: v('l_turno'), ocId: tp === 'oc' ? v('l_oc') : '', proy: tp === 'proy', pCli: tp === 'proy' ? vt('l_cli') : '', pDesc: tp === 'proy' ? vt('l_desc') : '', operario: v('l_op'), kgObj: +v('l_kg') || null, nota: vt('l_nota'), updatedAt: t, por: 'Cronograma General' });
  if (!o.fecha) return toast('Falta la fecha', true);
  if (tp === 'oc' && !o.ocId) return toast('Elegí la OC (o cambiá a proyectada)', true);
  if (tp === 'proy' && !o.pCli) return toast('Falta el cliente', true);
  if (tp === 'otro' && !o.nota) return toast('Poné en la nota qué tarea es', true);
  if (!o.id) o.id = uid('CRO');
  await escribir('Laminado y Refilado', () => lamWrite(s => {
    s.cronograma = s.cronograma || []; const i = s.cronograma.findIndex(x => x.id === o.id); if (i >= 0) s.cronograma[i] = o; else s.cronograma.push(o);
  }, s => (s.cronograma || []).some(x => x.id === o.id && (x.updatedAt || '') >= t)));
}
async function borrarLam() {
  if (!await confirmar('¿Borrar esta asignación de Laminado y Refilado?', 'Borrar')) return;
  const id = ED.id, t = nowISO();
  await escribir('Laminado y Refilado', () => lamWrite(s => {
    const c = (s.cronograma || []).find(x => x.id === id); if (c) { c.del = true; c.updatedAt = t; }
    s.tomb = s.tomb || {}; s.tomb['cronograma:' + id] = t;
  }, s => !!(s.tomb && s.tomb['cronograma:' + id])));
}
async function lamWrite(mut, ok) {
  const c = lamCfg();
  for (let i = 0; i < 2; i++) {
    const s = await jbGet(c);
    mut(s);
    await jbPut(c, s);
    const chk = await jbGet(c);
    if (ok(chk)) { S.lam = chk; return; }
  }
  throw new Error('Laminado no confirmó el cambio, probá de nuevo');
}

/* ── guardado común ── */
let escribiendo = false;
async function escribir(nom, fn) {
  if (escribiendo) return false; escribiendo = true; busy(true, 'Guardando en ' + nom + '…');
  try { await fn(); cerrar(); toast('Guardado en ' + nom + ' ✓'); render(); return true; }
  catch (e) { console.error(e); toast(e.message === 'SIN_GIST' ? 'Falta conectar el Gist de PET' : ('No se guardó: ' + e.message), true); return false; }
  finally { escribiendo = false; busy(false); }
}

/* ═════════ CONEXIÓN DEL GIST ═════════ */
function linkConexion() { // link de un toque para conectar otra compu o celular
  const c = gistCreds(); if (!c || !c.gistId || !c.token) return '';
  const b = btoa(unescape(encodeURIComponent(JSON.stringify({ g: c.gistId, t: c.token })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return 'https://winflexsa.github.io/Cronograma-General/#wfc=' + b;
}
function compartirConexion() {
  const l = linkConexion(); if (!l) return renderConexion();
  const txt = 'Abrí este link una sola vez para conectar el Cronograma General (viajes y entregas): ' + l;
  modal('📲 Conectar otra compu o celular', `
    <div class="info">Mandale este link a la persona por WhatsApp. Lo abre <b>una sola vez</b> en su compu o celular y queda conectada para siempre. Es personal: no lo pegues en grupos.</div>
    <div class="f w"><label>Link de conexión</label><input id="g_lk" class="mono" readonly value="${esc(l)}" onclick="this.select()"></div>`,
    `<div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="copiarLink()">Copiar link</button><a class="btn ent" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a><button class="btn" onclick="cerrar()">Listo</button></div>`);
}
function copiarLink() {
  const i = $('g_lk'); if (!i) return; i.select();
  try { navigator.clipboard.writeText(i.value).then(() => toast('Link copiado ✓'), () => { document.execCommand('copy'); toast('Link copiado ✓'); }); }
  catch (_) { document.execCommand('copy'); toast('Link copiado ✓'); }
}
function conectarConLink(id) { // acepta el link completo pegado
  const v = (vt(id) || '').trim(), m = v.match(/wfc=([^&\s]+)/);
  if (!m) return toast('Ese no es el link de conexión. Pedile a Matías el link que empieza con winflexsa.github.io/Cronograma-General/#wfc=', true);
  try {
    const j = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]).replace(/-/g, '+').replace(/_/g, '/')))));
    if (!j.g || !j.t) throw 0;
    lsSet('winflex_gist_credentials', JSON.stringify({ gistId: j.g, token: j.t })); cerrar(); toast('Conectado ✓'); cargarTodo(true);
  } catch (_) { toast('El link está incompleto. Copialo entero de nuevo', true); }
}
function sinConexion(det) {
  if (det !== 'Falta conectar') return `<div class="conex"><h3>No se pudo leer viajes y entregas</h3><p>Error: ${esc(det)}. Revisá internet y probá de nuevo.</p><div class="row"><button class="btn ent" onclick="cargarTodo(true)">Reintentar</button></div></div>`;
  return `<div class="conex"><h3>Esta compu todavía no está conectada</h3>
    <p>Para ver y cargar viajes y entregas, abrí <b>una sola vez</b> el link de conexión que te manda Matías por WhatsApp. Después queda conectada para siempre.</p>
    <p style="margin-bottom:8px">Si ya tenés el link, pegalo acá:</p>
    <div class="row"><input id="g_pl" placeholder="winflexsa.github.io/Cronograma-General/#wfc=…" onkeydown="if(event.key==='Enter')conectarConLink('g_pl')"><button class="btn ent" onclick="conectarConLink('g_pl')">Conectar</button></div></div>`;
}
function renderConexion() {
  const c = gistCreds() || {};
  modal('Conectar PET Chivilcoy y Viajes', `
    <div class="info">La forma fácil: abrí el <b>link de conexión</b> que te manda Matías, o pegalo acá abajo.</div>
    <div class="f w"><label>Link de conexión</label><input id="g_pl" class="mono" placeholder="winflexsa.github.io/Cronograma-General/#wfc=…"></div>
    <div class="f w"><button class="btn ent" onclick="conectarConLink('g_pl')">Conectar con el link</button></div>
    <div class="note" style="width:100%;margin:6px 0 2px">O cargá los datos a mano:</div>
    <div class="f w"><label>Gist ID</label><input id="g_id" value="${esc(c.gistId || '')}" class="mono"></div>
    <div class="f w"><label>Token de GitHub</label><input id="g_tk" type="password" value="${esc(c.token || '')}" class="mono"></div>`,
    `<div></div><div style="display:flex;gap:8px"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri" onclick="guardarConexion()">Conectar</button></div>`);
}
function guardarConexion() {
  const g = vt('g_id'), t = vt('g_tk'); if (!g || !t) return toast('Completá los dos datos', true);
  lsSet('winflex_gist_credentials', JSON.stringify({ gistId: g, token: t })); cerrar(); cargarTodo(true);
}

/* ═════════ ARRANQUE Y ACTUALIZACIÓN ═════════ */
function hayModal() { return !!$('modal').innerHTML || !!document.querySelector('.mbg'); }
setInterval(() => { if (!document.hidden && !hayModal() && !escribiendo) cargarTodo(false); }, 120000);
window.addEventListener('focus', () => { if (Date.now() - ultCarga > 30000 && !hayModal() && !escribiendo) cargarTodo(false); });
setInterval(async () => { // se actualiza sola cuando se publica una versión nueva
  if (hayModal()) return;
  try { const t = await (await fetch('index.html?v=' + Date.now(), { cache: 'no-store' })).text(); const m = t.match(/const VERSION = '([^']+)'/); if (m && m[1] !== VERSION) location.reload(); } catch (_) {}
}, 180000);
render();
cargarTodo(true);
</script>
